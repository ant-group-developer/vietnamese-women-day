    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Màn chờ trước khi React chạy, giống màn mở đầu (.intro trong src/index.css) — React thay toàn bộ #root khi render. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(circle at 50% 30%, #fff0f6 0%, #ffd9e8 45%, #cfeaff 100%);
        color: #5a2d44;
        font-family: 'Baloo 2', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .boot-card { max-width: 560px; }
      .boot-mascot {
        font-size: clamp(72px, 16vw, 120px);
        line-height: 1;
        margin: 0 auto 10px;
        width: max-content;
        animation: boot-bob 2.2s ease-in-out infinite;
      }
      .boot-badge {
        display: inline-block;
        background: #fff;
        color: #f0558a;
        padding: 6px 16px;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 1px;
        box-shadow: 0 6px 18px rgba(240, 85, 138, 0.15);
        margin-bottom: 12px;
      }
      .boot h1 {
        font-size: clamp(36px, 8vw, 64px);
        line-height: 1.05;
        margin: 8px 0;
        color: #f0558a;
        text-shadow: 0 4px 0 #fff, 0 10px 24px rgba(240, 85, 138, 0.25);
      }
      .boot p {
        font-size: clamp(16px, 3vw, 20px);
        margin: 8px 0 24px;
        color: #7a2d4e;
        text-wrap: balance;
      }
      .boot-loading {
        font-size: clamp(18px, 3vw, 22px);
        font-weight: 700;
        color: #f0558a;
      }
      .boot-loading i {
        font-style: normal;
        animation: boot-blink 1.2s infinite;
      }
      .boot-loading i:nth-child(2) { animation-delay: 0.2s; }
      .boot-loading i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0) rotate(0); }
        33% { transform: translateY(-9px) rotate(-6deg); }
        50% { transform: translateY(-14px) rotate(0); }
        66% { transform: translateY(-9px) rotate(6deg); }
      }
      @keyframes boot-blink {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @media (max-height: 500px) {
        .boot { padding: 12px 24px; }
        .boot-mascot { font-size: 56px; margin-bottom: 4px; }
        .boot h1 { font-size: 34px; margin: 4px 0; }
        .boot p { margin: 4px 0 12px; }
        .boot-badge { margin-bottom: 6px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mascot, .boot-loading i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mascot" aria-hidden="true">🌸</div>
          <div class="boot-badge">ANT Group · 20/10</div>
          <h1>Chúc mừng ngày 20/10</h1>
          <p>Hành trình thu thập hoa tặng các chị em 🌸</p>
          <div class="boot-loading">Đang tải<span aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></div>
        </div>
      </div>
    </div>
    <noscript>Chúc mừng ngày Phụ nữ Việt Nam 20/10! Vui lòng bật JavaScript để xem thiệp và hành trình thu thập hoa.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
